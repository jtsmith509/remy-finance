[project]
name = "remy-finance"
version = "0.0.1"
description = "REMY Finance: options-research engine and prospective paper-trade registry (stages R0-R1)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Josh Smith" }]
dependencies = [
    "pydantic>=2.9",
    "polars>=1.10",
    "pyarrow>=17",
    "exchange-calendars>=4.5",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.scripts]
remy = "remy_finance.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remy_finance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # raised inside exchange_calendars on pandas 3.x; not our code
    "ignore:Series.values returning an ndarray:Warning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ"]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["remy_finance.core.*", "remy_finance.registry.*"]
strict = true

[[tool.mypy.overrides]]
module = ["exchange_calendars.*"]
ignore_missing_imports = true
